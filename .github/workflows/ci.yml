name: CI

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'
  workflow_dispatch:

jobs:

  # GitHub-hosted jobs: xezim (built from source) and TestFloat are cached; the other
  # tools are installed in each run

  sw-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout_step
        uses: actions/checkout@v6
      - &xezim_cache_step
        name: xezim cache
        id: xezim
        uses: actions/cache@v4
        with:
          path: ~/xezim
          key: xezim-0.11.7-${{ runner.os }}
      - &xezim_build_step
        name: build xezim
        if: steps.xezim.outputs.cache-hit != 'true'
        run: >
          sudo apt-get update -q && sudo apt-get install -y -q clang llvm &&
          rustup toolchain install stable --profile minimal &&
          cargo +stable install --git https://github.com/aionhw/xezim --tag 0.11.7 --locked
          --root ~/xezim
      - &xezim_path_step
        name: xezim path
        run: echo "$HOME/xezim/bin" >> "$GITHUB_PATH"
      - &testfloat_step
        name: TestFloat cache
        uses: actions/cache@v4
        with:
          path: lib/sim/testfloat-build
          key: testfloat-${{ runner.os }}-${{ hashFiles('lib/sim/testfloat.mk') }}
      - name: model tests
        run: make sw-test
      - name: model against TestFloat and RTL
        run: make sw-check
      - name: examples
        run: make run CPROG=all

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout_step
      - *xezim_cache_step
      - *xezim_build_step
      - *xezim_path_step
      - *testfloat_step
      - name: smoke tests
        run: make test-smoke SIMULATOR=xezim

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [ smoke ]
    steps:
      - *checkout_step
      - name: install Verilator
        run: sudo apt-get update -q && sudo apt-get install -y -q verilator
      - *testfloat_step
      - name: Verilator coverage
        run: make coverage

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout_step
      - name: install TeX Live
        run: >
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
          latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          texlive-pictures
      - name: user guide
        run: make doc

  # Self-hosted: Xcelium runs on the Cadence server, which needs a registered runner

  # every TestFloat vector of level 1, plus the fmac stream and fpu mix tests
  full:
    runs-on: self-hosted
    timeout-minutes: 240
    needs: [ smoke ]
    defaults:
      run:
        # interactive shell: the runner's ~/.bashrc sets the tool paths and servers
        shell: bash -ieo pipefail {0}
    env:
      CADENCE_SERVER: micro7.lx.it.pt
      SIMULATOR: xcelium
    strategy:
      fail-fast: false
      matrix:
        core: [ fadd, fmul, fdiv, fmac, fpu ]
    steps:
      - *checkout_step
      - name: full tests
        run: make test-full CORE=${{ matrix.core }} REMOTE_ROOT_DIR=ci/ieee-754-float-${{ matrix.core }}
